name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A newer push waits instead of interrupting a running deploy.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Check API code
        working-directory: probroker-api
        run: |
          npm ci --ignore-scripts
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build website
        working-directory: probroker-web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4599/api/v1
          NEXT_PUBLIC_SITE_URL: https://prbroker.in
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          node ../scripts/ci-stub-api.js &
          npm ci
          npm run build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy to server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          # The server's authorized_keys entry only lets this key run scripts/deploy.sh.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "root@$VPS_HOST" "$GITHUB_SHA"
