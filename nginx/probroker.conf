# Replace prbroker.in / www.prbroker.in and api.prbroker.in with your real domains.
# Before HTTPS is issued (first run), comment out the two `listen 443` server blocks
# and the redirect below, so certbot can complete the HTTP-01 challenge on port 80.

server {
    listen 80;
    server_name prbroker.in www.prbroker.in api.prbroker.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Public site + admin panel (Next.js) ----
server {
    listen 443 ssl;
    server_name prbroker.in www.prbroker.in;

    ssl_certificate     /etc/letsencrypt/live/prbroker.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prbroker.in/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---- API (Express) on its own subdomain ----
server {
    listen 443 ssl;
    server_name api.prbroker.in;

    ssl_certificate     /etc/letsencrypt/live/prbroker.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prbroker.in/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
