# Domains served here:
#   allflats.in               public site + admin panel (Next.js)
#   api.allflats.in           API (Express)
#   prbroker.in, www.prbroker.in
#                             old domain: every URL 301-redirects to the same path on
#                             allflats.in so Google moves its rankings over. Keep these
#                             redirects (and the prbroker.in domain) for good.
#   api.prbroker.in           API, still served for clients that use the old address (GFY)
#   megnilservices.in         separate site, see the bottom of this file
#
# Certificates live in nginx/certbot/conf on the server. To add a new domain, issue its
# certificate first (HTTP-01 over port 80, using the acme-challenge location below):
#   docker exec probroker-certbot certbot certonly --webroot -w /var/www/certbot -d <domain>

# ---- HTTP: certbot challenges, then everything goes to HTTPS ----
# Site hostnames go straight to https://allflats.in, so the old domain needs only one hop.
server {
    listen 80;
    server_name allflats.in www.allflats.in prbroker.in www.prbroker.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://allflats.in$request_uri;
    }
}

server {
    listen 80;
    server_name api.allflats.in api.prbroker.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Public site + admin panel (Next.js) ----
server {
    listen 443 ssl;
    server_name allflats.in;

    ssl_certificate     /etc/letsencrypt/live/allflats.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allflats.in/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# www.allflats.in -> allflats.in
server {
    listen 443 ssl;
    server_name www.allflats.in;

    ssl_certificate     /etc/letsencrypt/live/allflats.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allflats.in/privkey.pem;

    return 301 https://allflats.in$request_uri;
}

# ---- Old domain: permanent redirect to the same path on allflats.in ----
server {
    listen 443 ssl;
    server_name prbroker.in www.prbroker.in;

    ssl_certificate     /etc/letsencrypt/live/prbroker.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prbroker.in/privkey.pem;

    return 301 https://allflats.in$request_uri;
}

# ---- API (Express) ----
server {
    listen 443 ssl;
    server_name api.allflats.in;

    ssl_certificate     /etc/letsencrypt/live/api.allflats.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.allflats.in/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Old API address, kept working for existing clients.
server {
    listen 443 ssl;
    server_name api.prbroker.in;

    ssl_certificate     /etc/letsencrypt/live/prbroker.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prbroker.in/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Megnil Services (megnilservices.in) ---
server {
    listen 80;
    server_name megnilservices.in www.megnilservices.in;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://megnilservices.in$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name www.megnilservices.in;
    ssl_certificate     /etc/letsencrypt/live/megnilservices.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/megnilservices.in/privkey.pem;
    return 301 https://megnilservices.in$request_uri;
}
server {
    listen 443 ssl;
    server_name megnilservices.in;
    ssl_certificate     /etc/letsencrypt/live/megnilservices.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/megnilservices.in/privkey.pem;
    client_max_body_size 15m;
    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $megnil_up http://megnil-web:3000;
        proxy_pass $megnil_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
